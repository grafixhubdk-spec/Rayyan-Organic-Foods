name: Build Rayyan Organic Foods APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          unzip -q Rayyan_Organic_Foods_Updated_Android_Project.zip -d source
          cd source/RayyanOrganicFoodsAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan-Organic-Foods-APK
          path: source/RayyanOrganicFoodsAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
